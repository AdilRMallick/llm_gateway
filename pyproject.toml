[project]
name = "llm-gateway"
version = "0.1.0"
description = "Multi-provider LLM gateway: one interface across Anthropic, OpenAI, and Google, with policy routing, failover, caching, and cost accounting."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.8",
    # Pinned exactly, and CI installs from this extra rather than pinning its own
    # version. A lint job that disagrees with local lint is worse than no lint job:
    # `ruff>=0.8` locally against `ruff==0.8.*` in CI produced a green working tree
    # and a red build, over an import-ordering rule the two versions read differently.
    "ruff==0.16.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mock_provider*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The repo has an ./alembic directory holding migrations, which makes import
# classification ambiguous: is `alembic` the local folder or the installed
# package? Say so explicitly instead of letting each ruff version guess.
known-third-party = ["alembic"]
